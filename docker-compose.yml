# Build the jar first (see the Dockerfile): ./gradlew :server:buildFatJar
# Then: docker compose up --build     (port from the PORT env var, default 8080)
services:
  server:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      # The container listens on the same port it is published on, so PORT means one thing everywhere.
      PORT: "${PORT:-8080}"
